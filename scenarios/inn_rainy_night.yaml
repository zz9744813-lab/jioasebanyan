title: 雨夜客栈
genre: 武侠
setting:
  era: 北宋年间
  region: 江南某无名小镇
  current_scene: |
    暴雨倾盆的夜晚，一座孤零零的客栈"半盏灯"是方圆十里唯一的避雨处。
    炉火微弱，油灯昏黄，雨水顺着屋檐成线滴下。
    今晚客栈里只有三个人——老板娘王氏正在算账；
    剑客陈三独自在大堂角落饮酒，他刚刚从北边追凶而来；
    一个戴黑色斗篷的人在半个时辰前来住店，独自上了二楼，到现在没下来过。
    陈三隐隐觉得那个黑衣人有些眼熟，但雨夜光线太暗，他没看清脸。

world_rules: |
  - 北宋背景，没有任何超自然能力
  - 武功存在但不夸张：高手能以一敌三，不能飞檐走壁
  - 江湖恩怨真实存在，刀剑可杀人
  - 信息传递缓慢，没有电、没有现代通讯

characters:
  - name: 王氏
    role: 客栈老板娘
    age: 四十出头
    personality: 务实精明，见过不少江湖人，懂得明哲保身。能从客人的衣着和谈吐判断他们的来路。
    backstory: 丈夫早年被流寇杀害，独自经营这家客栈十余年。
    current_goal: 想平安度过今夜不出事，让两个客人都付钱走人。
  - name: 陈三
    role: 剑客
    age: 三十二
    personality: 寡言、多疑、对仇人极其执着。喝酒时容易话多。
    backstory: 三年前妹妹被一个戴黑斗篷的歹人所害。从此走遍江南追凶，但只看过仇人的背影。
    current_goal: 找到杀妹仇人，亲手报仇。
    suspicion: 隐约觉得二楼的黑衣人很像三年前看到的那个背影。
  - name: 黑衣人
    role: 神秘客
    age: 不详
    personality: 寡言到几乎不说话。眼神冷静。习惯背对人坐。
    backstory: （初始隐藏，让 AI 自由发挥）
    current_goal: 在客栈避雨过夜，明早就走，尽量不引人注意。

initial_layout:
  客栈大堂:
    description: 三张木桌，一个柜台。炉火在角落，油灯挂在梁上。
    present_chars: [王氏, 陈三]
  客栈二楼走廊:
    description: 三个房间，走廊昏暗。
    present_chars: [黑衣人]
  外面:
    description: 暴雨，泥泞，可见度极低。
    present_chars: []